  <path d="m210 74 14 45-62 20-34-26Z" fill="#ff425a" opacity=".28"/><path d="m224 119-17 49-79-55 34 26Z" fill="url(#facetB)"/>
  <path d="m207 168-32 39-47-94Z" fill="#730014" opacity=".42"/><path d="m175 207-48 20-31-63 32-51Z" fill="#ad0924" opacity=".46"/>
  <path d="m127 227-45-16 14-47Z" fill="#ff4357" opacity=".22"/><path d="m82 211-41-35 55-12Z" fill="#650010" opacity=".35"/>
