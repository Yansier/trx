<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">TRX energy core</title>
  <desc id="desc">A faceted, irregular red energy crystal containing a light triangular emblem.</desc>
  <defs>
    <linearGradient id="crystal" x1="42" y1="35" x2="218" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8993"/><stop offset=".22" stop-color="#ff3d52"/><stop offset=".58" stop-color="#c60c2a"/><stop offset="1" stop-color="#5e0011"/>
    </linearGradient>
    <linearGradient id="edge" x1="76" y1="39" x2="181" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd4d8" stop-opacity=".95"/><stop offset=".32" stop-color="#ff596b" stop-opacity=".72"/><stop offset="1" stop-color="#880018" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="facetA" x1="70" y1="58" x2="150" y2="179" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#ff193a" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="facetB" x1="210" y1="85" x2="93" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff9ca6" stop-opacity=".34"/><stop offset="1" stop-color="#5a0010" stop-opacity=".48"/>
    </linearGradient>
    <radialGradient id="heart" cx="47%" cy="42%" r="60%">
      <stop stop-color="#ff8290" stop-opacity=".9"/><stop offset=".48" stop-color="#f11739" stop-opacity=".34"/><stop offset="1" stop-color="#810019" stop-opacity="0"/>
    </radialGradient>
    <filter id="outerGlow" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 .35  0 .18 0 0 0  0 0 .18 0 0  0 0 0 .78 0"/>
    </filter>
    <filter id="innerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="soft"/><feComposite in="soft" in2="SourceGraphic" operator="arithmetic" k2="1" k3="1"/>
    </filter>
    <filter id="emblemGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
